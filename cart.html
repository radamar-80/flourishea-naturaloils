<!DOCTYPE html>
<html>
<head>

<title>Cart</title>

<style>

body{
font-family:Poppins,sans-serif;
padding:20px;
background:#f7f2ea;
}

.cart-item{
background:white;
padding:20px;
margin-bottom:15px;
border-radius:15px;
display:flex;
gap:20px;
align-items:center;
}

.cart-item img{
width:100px;
height:100px;
object-fit:cover;
border-radius:10px;
}

.total{
font-size:30px;
font-weight:bold;
margin-top:20px;
}

button{
background:red;
color:white;
border:none;
padding:10px;
border-radius:8px;
cursor:pointer;
}

</style>

</head>

<body>

<h1>Your Cart</h1>

<div id="cartItems"></div>

<div
class="total"
id="cartTotal">
</div>

<script>

loadCart();

function loadCart(){

let cart =

JSON.parse(
localStorage.getItem("cart")
) || [];

let html="";

let total=0;

cart.forEach((item,index)=>{

total += Number(item.price);

html += `

<div class="cart-item">

<img src="${item.image}">

<div>

<h3>${item.name}</h3>

<p>₦${item.price}</p>

</div>

<button
onclick="removeItem(${index})">
Remove
</button>

</div>

`;

});

document.getElementById(
"cartItems"
).innerHTML = html;

document.getElementById(
"cartTotal"
).innerHTML =
"Total: ₦" + total;

}

function removeItem(index){

let cart =

JSON.parse(
localStorage.getItem("cart")
) || [];

cart.splice(index,1);

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

loadCart();

}

</body>
</html>
