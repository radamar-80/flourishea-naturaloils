<!DOCTYPE html>
<html>
<head>
<title>Wishlist</title>

<style>

body{
font-family:Poppins,sans-serif;
background:#f7f2ea;
padding:20px;
}

.item{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:15px;
display:flex;
gap:20px;
align-items:center;
}

.item img{
width:100px;
height:100px;
object-fit:cover;
border-radius:10px;
}

button{
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
}

.move{
background:#4d7c57;
color:white;
}

.remove{
background:red;
color:white;
}

</style>
</head>

<body>

<h1>Wishlist</h1>

<div id="wishlistItems"></div>

<script>

loadWishlist();

function loadWishlist(){

let wishlist =
JSON.parse(
localStorage.getItem("wishlist")
) || [];

let html="";

wishlist.forEach((item,index)=>{

html += `

<div class="item">

<img src="${item.image}">

<div>

<h3>${item.name}</h3>

<p>₦${item.price}</p>

</div>

<button
class="move"
onclick="moveToCart(${index})">
Move To Cart
</button>

<button
class="remove"
onclick="removeWishlist(${index})">
Remove
</button>

</div>

`;

});

document.getElementById(
"wishlistItems"
).innerHTML = html;

}

function moveToCart(index){

let wishlist =
JSON.parse(
localStorage.getItem("wishlist")
) || [];

let cart =
JSON.parse(
localStorage.getItem("cart")
) || [];

cart.push(wishlist[index]);

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

wishlist.splice(index,1);

localStorage.setItem(
"wishlist",
JSON.stringify(wishlist)
);

loadWishlist();

}

function removeWishlist(index){

let wishlist =
JSON.parse(
localStorage.getItem("wishlist")
) || [];

wishlist.splice(index,1);

localStorage.setItem(
"wishlist",
JSON.stringify(wishlist)
);

loadWishlist();

}

</script>

</body>
</html>
