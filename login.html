<!DOCTYPE html>
<html>
<head>

<title>Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>

body{
font-family:Poppins,sans-serif;
background:#f7f2ea;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
padding:40px;
width:400px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:10px;
}

button{
width:100%;
padding:12px;
background:#4d7c57;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

a{
display:block;
text-align:center;
margin-top:15px;
}

</style>

</head>

<body>

<div class="box">

<h2>Customer Login</h2>

<input
type="email"
id="email"
placeholder="Email">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="login()">
Login
</button>

<a href="register.html">
Create Account
</a>

</div>

<script>

function login(){

let users =
JSON.parse(
localStorage.getItem("users")
) || [];

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

const user =
users.find(u =>
u.email===email &&
u.password===password
);

if(user){

localStorage.setItem(
"currentUser",
JSON.stringify(user)
);

window.location.href =
"account.html";

}else{

alert("Invalid login");

}

}

</script>

</body>
</html>
