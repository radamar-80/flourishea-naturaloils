<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flourishea Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f7f2ea;
}

/* LOGIN */

#loginPage{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.login-box{
background:white;
padding:40px;
width:350px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.login-box h2{
margin-bottom:20px;
color:#4d7c57;
}

.login-box input{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:10px;
}

.login-btn{
width:100%;
padding:12px;
border:none;
background:#4d7c57;
color:white;
border-radius:10px;
cursor:pointer;
}

/* DASHBOARD */

#dashboard{
display:none;
}

header{
background:white;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo{
font-size:28px;
font-weight:700;
color:#4d7c57;
}

.admin-tag{
font-size:14px;
color:gray;
}

.container{
padding:30px;
}

.card{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
margin-bottom:25px;
}

.card h2{
margin-bottom:20px;
color:#4d7c57;
}

input,
textarea,
select{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:10px;
}

textarea{
height:120px;
resize:none;
}

.save-btn{
width:100%;
padding:14px;
background:#4d7c57;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

.preview{
width:150px;
height:150px;
border-radius:15px;
border:2px dashed #ccc;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
margin-bottom:15px;
}

.preview img{
width:100%;
height:100%;
object-fit:cover;
}

.product{
display:flex;
align-items:center;
gap:15px;
background:#fafafa;
padding:15px;
border-radius:15px;
margin-bottom:15px;
}

.product img{
width:80px;
height:80px;
border-radius:10px;
object-fit:cover;
}

.product-info{
flex:1;
}

.delete-btn{
background:red;
color:white;
border:none;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
}

</style>
</head>

<body>

<!-- LOGIN PAGE -->

<div id="loginPage">

<div class="login-box">

<h2>Admin Login</h2>

<input
id="email"
type="email"
placeholder="Email">

<input
id="password"
type="password"
placeholder="Password">

<button
class="login-btn"
onclick="login()">
Login
</button>

</div>

</div>

<!-- DASHBOARD -->

<div id="dashboard">

<header>

<div>
<div class="logo">Flourishea</div>
<div class="admin-tag">
Admin Dashboard
</div>
</div>

</header>

<div class="container">

<div class="card">

<h2>Add Product</h2>

<div class="preview" id="preview">
Image Preview
</div>

<input
type="file"
id="imageInput"
accept="image/*">

<input
type="text"
id="name"
placeholder="Product Name">

<select id="category">

<option>Cream</option>
<option>Oil</option>
<option>Lotion</option>

</select>

<input
type="number"
id="price"
placeholder="Price">

<textarea
id="description"
placeholder="Description">
</textarea>

<button
class="save-btn"
onclick="saveProduct()">
Add Product
</button>

</div>

<div class="card">

<h2>Products</h2>

<div id="productList"></div>

</div>

</div>

</div>

<script>

let uploadedImage = "";

function login(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

if(
email==="admin@flourishea.com" &&
password==="admin123"
){

document.getElementById("loginPage")
.style.display="none";

document.getElementById("dashboard")
.style.display="block";

loadProducts();

}else{

alert("Wrong login details");

}

}

/* IMAGE PREVIEW */

document
.getElementById("imageInput")
.addEventListener("change",function(e){

const file=e.target.files[0];

if(!file) return;

const reader=new FileReader();

reader.onload=function(event){

uploadedImage=event.target.result;

document.getElementById("preview")
.innerHTML=
`<img src="${uploadedImage}">`;

};

reader.readAsDataURL(file);

});

/* SAVE PRODUCT */

function saveProduct(){

const product={

image:uploadedImage,

name:document.getElementById("name").value,

category:document.getElementById("category").value,

price:document.getElementById("price").value,

description:document.getElementById("description").value

};

let products=
JSON.parse(
localStorage.getItem("products")
) || [];

products.push(product);

localStorage.setItem(
"products",
JSON.stringify(products)
);

loadProducts();

alert("Product Added");

}

/* LOAD PRODUCTS */

function loadProducts(){

let products=
JSON.parse(
localStorage.getItem("products")
) || [];

let html="";

products.forEach((product,index)=>{

html += `

<div class="product">

<img src="${product.image}">

<div class="product-info">

<h3>${product.name}</h3>

<p>${product.category}</p>

<p>₦${product.price}</p>

</div>

<button
class="delete-btn"
onclick="deleteProduct(${index})">
Delete
</button>

</div>

`;

});

document.getElementById("productList")
.innerHTML=html;

}

/* DELETE */

function deleteProduct(index){

let products=
JSON.parse(
localStorage.getItem("products")
) || [];

products.splice(index,1);

localStorage.setItem(
"products",
JSON.stringify(products)
);

loadProducts();

}

</script>

</body>
</html>
